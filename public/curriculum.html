<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎬 Video Curriculum - FSSociety</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 900px; margin: 2rem auto; padding: 0 1rem; line-height: 1.6; color: #333; }
    h1, h2, h3 { color: #1a1a2e; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 6px; overflow-x: auto; font-size: 0.9em; }
    code { background: #f6f8fa; padding: 2px 6px; border-radius: 3px; }
    table { border-collapse: collapse; width: 100%; margin: 1rem 0; }
    th, td { border: 1px solid #e1e4e8; padding: 8px 12px; text-align: left; }
    th { background: #f6f8fa; font-weight: 600; }
    a { color: #0366d6; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 0.8em; background: #e1e4e8; }
    .badge-buddy { background: #22c55e; color: white; }
    .badge-academy { background: #3b82f6; color: white; }
    .badge-consult { background: #f59e0b; color: white; }
    .badge-partner { background: #8b5cf6; color: white; }
  </style>
</head>
<body>
  <h1>🎬 MASTER VIDEO CURRICULUM</h1>
  <p><em>Ecosistem FSSociety • 20 videoclipuri × max 5 minute</em></p>
  <p>
    <span class="badge badge-buddy">Buddy $9</span>
    <span class="badge badge-academy">Academy $29</span>
    <span class="badge badge-consult">1:1 $99</span>
    <span class="badge badge-partner">Parteneriat $899</span>
  </p>
  <hr>
  <pre id="content">Se încarcă...</pre>
  <script>
    fetch('video-curriculum.md')
      .then(r => r.text())
      .then(t => document.getElementById('content').textContent = t)
      .catch(e => document.getElementById('content').textContent = '❌ Eroare la încărcare: ' + e);
  </script>
</body>
</html>
